<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Happy Birthday Shivansh</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:Georgia,'Times New Roman',serif;background:#071228;color:#fff}.sky{position:fixed;inset:0;background:radial-gradient(circle at 50% 115%,#294372 0,transparent 48%),linear-gradient(#071228,#101d3a)}.stars{position:absolute;inset:0;background-image:radial-gradient(circle,#fff 0 1px,transparent 1.4px);background-size:43px 43px;opacity:.22;animation:drift 18s linear infinite}@keyframes drift{to{transform:translateY(43px)}}
.wrap{position:relative;z-index:2;height:100%;display:grid;place-items:center;padding:24px;text-align:center}.intro{transition:opacity .7s,transform .7s}.intro.hide{opacity:0;transform:translateY(-12px);pointer-events:none}.tiny{font:600 .72rem Arial,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#9eb3dc;margin-bottom:22px}.btn{border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.06);backdrop-filter:blur(8px);color:#fff;border-radius:999px;padding:14px 24px;font:700 .78rem Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:.25s}.btn:hover{background:#fff;color:#101d3a;transform:translateY(-2px)}
.message{position:absolute;inset:0;display:grid;place-items:center;padding:24px;opacity:0;pointer-events:none;transition:opacity 1s}.message.show{opacity:1}.words{font-size:clamp(2.6rem,9vw,6.8rem);line-height:.92;letter-spacing:-.055em;margin:0;text-shadow:0 0 25px rgba(185,211,255,.26)}.words span{display:block;opacity:0;transform:translateY(18px);filter:blur(8px)}.show .words span{animation:reveal 1.1s cubic-bezier(.2,.8,.2,1) forwards}.show .words span:nth-child(2){animation-delay:.48s}.show .words span:nth-child(3){animation-delay:.96s;color:#f5cf75}@keyframes reveal{to{opacity:1;transform:none;filter:none}}.wish{opacity:0;margin:28px auto 0;font-size:clamp(1rem,2.4vw,1.2rem);line-height:1.65;color:#dce6fa;max-width:520px}.show .wish{animation:fade 1s 1.9s forwards}@keyframes fade{to{opacity:1}}.spark{position:fixed;width:5px;height:5px;background:#fff;border-radius:50%;box-shadow:0 0 11px 3px #b9d3ff;animation:fly 2.6s ease-out forwards;pointer-events:none}@keyframes fly{0%{opacity:0;transform:scale(.2)}20%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(0)}}@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body><div class="sky"><div class="stars"></div></div><main class="wrap"><section class="intro" id="intro"><div class="tiny">For Shivansh</div><button class="btn" id="open">Open</button></section><section class="message" id="message"><div><h1 class="words"><span>Happy</span><span>Birthday,</span><span>Shivansh!</span></h1><p class="wish">Hope you have a lovely day and a wonderful year ahead.<br><br>— Yasha</p></div></section></main><script>
const b=document.getElementById('open'),i=document.getElementById('intro'),m=document.getElementById('message');b.addEventListener('click',()=>{i.classList.add('hide');setTimeout(()=>m.classList.add('show'),420);for(let n=0;n<55;n++)setTimeout(spark,n*35)});function spark(){const s=document.createElement('i');s.className='spark';s.style.left=(45+Math.random()*10)+'vw';s.style.top=(40+Math.random()*20)+'vh';s.style.setProperty('--x',(Math.random()*600-300)+'px');s.style.setProperty('--y',(Math.random()*500-250)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),2800)}
</script></body></html>
