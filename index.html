<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Happy Birthday Shivansh</title><style>
:root{--night:#10132f;--violet:#29265d;--pink:#ed8fa4;--gold:#ffd86f;--cream:#fff6dc;--blue:#9fcdf3}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:Georgia,serif;color:#fff;background:var(--night);touch-action:none}.sky{position:fixed;inset:0;background:radial-gradient(circle at 50% 105%,#55477e 0,transparent 48%),linear-gradient(#0e122d,#272455)}.moon{position:absolute;right:8vw;top:7vh;width:55px;height:55px;border-radius:50%;background:#fff3c7;box-shadow:0 0 40px #ffe9a588}.star{position:absolute;color:#fff4c8;animation:blink 1.8s ease-in-out infinite alternate}.star:nth-child(2){left:9%;top:14%;font-size:1.3rem}.star:nth-child(3){left:19%;top:7%;animation-delay:.5s}.star:nth-child(4){right:19%;top:25%;font-size:1.5rem;animation-delay:.9s}.star:nth-child(5){left:13%;top:42%;animation-delay:1.2s}.star:nth-child(6){right:12%;top:48%;font-size:1.2rem}@keyframes blink{to{opacity:.28;transform:scale(.7) rotate(20deg)}}.scene{position:relative;z-index:2;height:100svh;display:grid;place-items:center;text-align:center;padding:12px}.stage{width:min(560px,100%)}.aside{font-size:clamp(1rem,3vw,1.18rem);font-style:italic;color:#d7d7f3;margin:0 0 2px;animation:fade .8s both}@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.cake{position:relative;width:310px;height:286px;margin:0 auto}.plate{position:absolute;left:5px;bottom:8px;width:300px;height:13px;border-radius:50%;background:#c7d7ef;box-shadow:0 7px 20px #0007;animation:plate .45s both}.tier{position:absolute;left:50%;transform:translateX(-50%);border-radius:15px 15px 7px 7px;background:linear-gradient(90deg,#e6bf92,#fff0cf 46%,#ddb282);border-bottom:6px solid #d4657d;box-shadow:0 7px 13px #0003;animation:land .6s cubic-bezier(.2,.85,.3,1.25) both}.tier:after{content:"";position:absolute;left:0;right:0;top:-1px;height:17px;background:radial-gradient(circle at 12px 0,#fff9eb 0 12px,transparent 12.5px);background-size:24px 18px}.tier:before{content:"✦  ·  ✧  ·  ✦";position:absolute;left:0;right:0;bottom:9px;color:#d4657d;font:700 13px Arial;letter-spacing:8px;white-space:nowrap;overflow:hidden}.t1{bottom:21px;width:265px;height:70px;animation-delay:.1s}.t2{bottom:96px;width:201px;height:63px;animation-delay:.3s}.t3{bottom:164px;width:137px;height:57px;animation-delay:.5s}@keyframes land{from{opacity:0;transform:translate(-50%,-45px) scale(.7)}70%{transform:translate(-50%,4px) scale(1.03)}to{opacity:1;transform:translate(-50%,0) scale(1)}}@keyframes plate{from{opacity:0;transform:scaleX(.4)}}
.candle{position:absolute;width:9px;height:33px;border-radius:5px 5px 1px 1px;background:repeating-linear-gradient(140deg,#fff2bb 0 6px,#e06d7f 7px 12px);z-index:3;animation:candleDrop .35s .9s both}.candle:before{content:"";position:absolute;left:4px;top:-6px;width:2px;height:7px;background:#292929}.flame{position:absolute;left:-4px;top:-30px;width:17px;height:25px;border-radius:50%;background:radial-gradient(circle at 50% 68%,#fff 0 12%,#ffe676 24%,#ff8b39 62%,transparent 65%);filter:drop-shadow(0 0 10px #ffcb52);opacity:0;transform:scale(.1);transition:.3s}.on{animation:boing .35s}.on .flame{opacity:1;transform:scale(1);animation:flicker .4s infinite alternate}.out .flame{opacity:0!important;transform:translate(12px,-9px) scale(.1)!important}.c1{left:62px;bottom:91px}.c2{left:239px;bottom:91px}.c3{left:96px;bottom:159px}.c4{left:205px;bottom:159px}.c5{left:128px;bottom:221px}.c6{left:173px;bottom:221px}@keyframes candleDrop{from{opacity:0;transform:translateY(-18px)}}@keyframes boing{50%{transform:translateY(-8px)}}@keyframes flicker{to{transform:scale(.86) rotate(4deg)}}
.ritual{height:112px}.instruction{margin:0 0 11px;font-size:clamp(1.15rem,4vw,1.45rem)}.matchbox{position:relative;width:min(360px,88vw);height:57px;margin:auto;border-radius:10px;background:#e7c992;box-shadow:0 9px 20px #0005}.matchbox:before{content:"MAKE A WISH";position:absolute;left:18px;top:20px;color:#7b5262;font:800 .63rem Arial;letter-spacing:.16em}.strip{position:absolute;right:11px;top:9px;width:135px;height:39px;border-radius:4px;background:repeating-linear-gradient(45deg,#67322e 0 2px,#945044 2px 4px)}.match{position:absolute;left:13px;top:24px;width:165px;height:9px;border-radius:20px;background:#f0cf8b;z-index:5;filter:drop-shadow(0 3px 2px #0005)}.match:after{content:"";position:absolute;right:-7px;top:-5px;width:20px;height:20px;border-radius:50%;background:#aa3634}.match.burning:before{content:"";position:absolute;right:-10px;top:-30px;width:19px;height:28px;border-radius:50%;background:radial-gradient(circle at 50% 68%,#fff 0 12%,#ffe676 24%,#ff8b39 62%,transparent 65%);filter:drop-shadow(0 0 10px #ffcb52)}.hint{margin-top:7px;font:700 .63rem Arial;letter-spacing:.14em;text-transform:uppercase;color:#b7bbe0}.ready .matchbox,.ready .instruction,.ready .hint{display:none}.blow{display:none;margin:16px auto;border:1px solid #ffffff91;background:#ffffff12;color:#fff;border-radius:99px;padding:13px 22px;font:700 .72rem Arial;letter-spacing:.1em;text-transform:uppercase;box-shadow:0 6px 20px #0003}.ready .blow{display:block;animation:fade .6s}.message{position:fixed;z-index:8;inset:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle,#51447c,#171839 68%);opacity:0;pointer-events:none;transition:.9s}.finished .message{opacity:1}.message h1{font-size:clamp(3rem,11vw,6.3rem);line-height:.88;letter-spacing:-.06em;color:var(--gold);margin:0 0 22px;text-shadow:0 6px 0 #bc6079}.finished h1{animation:finalPop .8s .3s cubic-bezier(.2,.85,.3,1.3) both}@keyframes finalPop{from{opacity:0;transform:scale(.5) rotate(-5deg)}}.message p{font-size:clamp(1rem,2.7vw,1.22rem);line-height:1.65;color:#f1efff;margin:auto;max-width:500px}.confetti,.sparkle{position:fixed;z-index:10;pointer-events:none}.confetti{top:-20px;width:10px;height:15px;animation:fall 3.2s linear forwards}.sparkle{width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);animation:burst .65s ease-out forwards}@keyframes fall{to{transform:translate(var(--x),110vh) rotate(760deg)}}@keyframes burst{to{opacity:0;transform:translate(var(--x),var(--y)) scale(0)}}@media(max-width:480px){.cake{transform:scale(.82);margin:-23px auto}.aside{margin-bottom:-4px}.ritual{height:106px}}
</style></head><body><div class="sky"><i class="moon"></i><i class="star">✦</i><i class="star">✧</i><i class="star">✦</i><i class="star">✧</i><i class="star">✦</i></div><main class="scene"><section class="stage" id="stage"><p class="aside">A birthday obviously requires cake.</p><div class="cake" id="cake"><i class="plate"></i><i class="tier t1"></i><i class="tier t2"></i><i class="tier t3"></i><i class="candle c1"><b class="flame"></b></i><i class="candle c2"><b class="flame"></b></i><i class="candle c3"><b class="flame"></b></i><i class="candle c4"><b class="flame"></b></i><i class="candle c5"><b class="flame"></b></i><i class="candle c6"><b class="flame"></b></i></div><div class="ritual"><p class="instruction">Strike the match</p><div class="matchbox" id="box"><i class="strip"></i><i class="match" id="match"></i></div><div class="hint">Drag to the right</div><button class="blow" id="blow">Make a wish & blow them out ✦</button></div></section><section class="message"><div><h1>Happy Birthday,<br>Shivansh!!!</h1><p>I hope you have the loveliest day and a very good year ahead.<br><br>— Yasha</p></div></section></main><script>
const M=document.getElementById('match'),B=document.getElementById('box'),S=document.getElementById('stage'),C=document.getElementById('cake'),K=[...document.querySelectorAll('.candle')];let drag=0,start=0,struck=0;M.onpointerdown=e=>{if(struck)return;drag=1;start=e.clientX;M.setPointerCapture(e.pointerId)};M.onpointermove=e=>{if(!drag||struck)return;let max=B.clientWidth-M.offsetWidth-8,x=Math.max(13,Math.min(max,13+e.clientX-start));M.style.left=x+'px';if(x>max*.8)ignite()};M.onpointerup=()=>{drag=0;if(!struck)M.style.left='13px'};
async function ignite(){struck=1;drag=0;M.classList.add('burning');await wait(350);let r=M.getBoundingClientRect();M.style.position='fixed';M.style.left=r.left+'px';M.style.top=r.top+'px';M.style.width='125px';document.body.appendChild(M);for(const c of [...K].reverse()){let q=c.getBoundingClientRect(),to={left:q.left-114+'px',top:q.top-7+'px',transform:'rotate(-11deg)'};await M.animate([{left:M.style.left,top:M.style.top,transform:'rotate(0)'},to],{duration:460,easing:'cubic-bezier(.4,0,.2,1)',fill:'forwards'}).finished;M.style.left=to.left;M.style.top=to.top;c.classList.add('on');burst(c);await wait(150)}await M.animate([{opacity:1},{opacity:0}],{duration:350,fill:'forwards'}).finished;M.remove();S.classList.add('ready')}
function burst(c){let r=c.getBoundingClientRect();for(let i=0;i<10;i++){let s=document.createElement('i');s.className='sparkle';s.style.left=r.left+4+'px';s.style.top=r.top-10+'px';s.style.setProperty('--x',Math.random()*80-40+'px');s.style.setProperty('--y',Math.random()*70-55+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),700)}}function wait(n){return new Promise(r=>setTimeout(r,n))}
document.getElementById('blow').onclick=()=>{C.classList.add('out');setTimeout(()=>{S.classList.add('finished');music();party()},430)};function party(){let col=['#ffd86f','#ed8fa4','#9fcdf3','#fff'];for(let i=0;i<110;i++){let c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background=col[i%4];c.style.borderRadius=i%3?'2px':'50%';c.style.setProperty('--x',Math.random()*220-110+'px');c.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),4100)}}
function music(){let X=new(window.AudioContext||window.webkitAudioContext)(),N={G:392,A:440,B:493.88,C:523.25,D:587.33,E:659.25,F:349.23},q=[['G',.2],['G',.2],['A',.4],['G',.4],['C',.4],['B',.75],['G',.2],['G',.2],['A',.4],['G',.4],['D',.4],['C',.75],['G',.2],['G',.2],['E',.4],['C',.4],['B',.4],['A',.75],['F',.2],['F',.2],['E',.4],['C',.4],['D',.4],['C',.8]],t=X.currentTime+.1;q.forEach(([n,d])=>{let o=X.createOscillator(),g=X.createGain();o.type='triangle';o.frequency.value=N[n];g.gain.setValueAtTime(.1,t);g.gain.exponentialRampToValueAtTime(.001,t+d*.9);o.connect(g).connect(X.destination);o.start(t);o.stop(t+d);t+=d})}
</script></body></html>
