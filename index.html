<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Happy Birthday Shivansh</title><style>
:root{--navy:#08142b;--blue:#14284c;--cream:#fff3d8;--pink:#cf7180;--gold:#ffd46a}*{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow:hidden}body{font-family:Georgia,serif;color:white;background:var(--navy);touch-action:none}.sky{position:fixed;inset:0;background:radial-gradient(circle at 50% 100%,#263f6e 0,transparent 50%),linear-gradient(var(--navy),var(--blue))}.sky:after{content:"";position:absolute;inset:0;background-image:radial-gradient(#fff 0 1px,transparent 1.4px);background-size:53px 53px;opacity:.16}.scene{position:relative;z-index:2;height:100svh;display:grid;place-items:center;text-align:center;padding:14px}.stage{width:min(560px,100%);transition:.7s}.label{font:700 .68rem Arial;letter-spacing:.24em;text-transform:uppercase;color:#a9bbe0;margin-bottom:5px}
.cake{position:relative;width:300px;height:275px;margin:0 auto}.plate{position:absolute;left:4px;bottom:8px;width:292px;height:12px;background:#d5def0;border-radius:50%;box-shadow:0 6px 18px #0006}.tier{position:absolute;left:50%;transform:translateX(-50%);background:linear-gradient(90deg,#e8cda6,#fff4db 48%,#deb98b);border-bottom:5px solid #b95467;border-radius:13px 13px 6px 6px;box-shadow:0 5px 10px #0002}.tier:after{content:"";position:absolute;left:0;right:0;top:0;height:13px;background:radial-gradient(circle at 12px -1px,#fffaf0 0 12px,transparent 12.5px);background-size:24px 18px}.bottom{bottom:20px;width:260px;height:68px}.middle{bottom:92px;width:198px;height:61px}.top{bottom:157px;width:134px;height:55px}
.candle{position:absolute;width:9px;height:34px;border-radius:4px 4px 1px 1px;background:repeating-linear-gradient(145deg,#fff0ba 0 6px,#ca5e69 7px 12px);z-index:3}.candle:before{content:"";position:absolute;width:2px;height:7px;left:4px;top:-6px;background:#292929}.flame{position:absolute;width:16px;height:24px;left:-3.5px;top:-29px;border-radius:55% 45% 50% 50%;background:radial-gradient(circle at 50% 68%,#fff 0 12%,#ffe16f 25%,#ff8e38 62%,transparent 65%);filter:drop-shadow(0 0 9px #ffc94f);opacity:0;transform:scale(.1);transition:opacity .35s,transform .35s}.candle.on .flame{opacity:1;transform:scale(1);animation:flicker .42s ease-in-out infinite alternate}.cake.out .flame{opacity:0!important;transform:translate(10px,-8px) scale(.1)!important}.c1{left:61px;bottom:88px}.c2{left:230px;bottom:88px}.c3{left:94px;bottom:153px}.c4{left:197px;bottom:153px}.c5{left:126px;bottom:212px}.c6{left:165px;bottom:212px}@keyframes flicker{to{transform:scale(.88) rotate(3deg)}}
.prompt{height:108px;position:relative}.instruction{font-size:clamp(1.1rem,4vw,1.45rem);margin:0 0 12px;transition:.4s}.matchbox{position:relative;width:min(360px,88vw);height:58px;margin:auto;border-radius:8px;background:#dabc83;box-shadow:0 9px 22px #0005}.strip{position:absolute;right:12px;top:10px;width:135px;height:38px;border-radius:3px;background:repeating-linear-gradient(45deg,#6c342e 0 2px,#914d40 2px 4px)}.match{position:absolute;left:12px;top:24px;width:170px;height:9px;border-radius:20px;background:#e9c982;z-index:7;filter:drop-shadow(0 3px 2px #0005);cursor:grab}.match:after{content:"";position:absolute;right:-7px;top:-5px;width:20px;height:20px;border-radius:50%;background:#a43330}.match.burning:before{content:"";position:absolute;right:-10px;top:-29px;width:19px;height:27px;border-radius:50%;background:radial-gradient(circle at 50% 68%,#fff 0 12%,#ffe16f 25%,#ff8e38 62%,transparent 65%);filter:drop-shadow(0 0 10px #ffc94f)}.hint{font:600 .65rem Arial;letter-spacing:.14em;text-transform:uppercase;color:#a8b7d7;margin-top:8px}.blow{display:none;margin:10px auto;border:1px solid #ffffff80;background:#ffffff0e;color:white;border-radius:99px;padding:13px 22px;font:700 .72rem Arial;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}.ready .matchbox,.ready .instruction,.ready .hint{display:none}.ready .blow{display:block}.message{position:absolute;inset:0;display:grid;place-items:center;padding:24px;background:linear-gradient(#08142be8,#14284cf2);opacity:0;pointer-events:none;transition:1s;z-index:8}.finished .message{opacity:1}.message h1{font-size:clamp(2.8rem,10vw,6rem);line-height:.9;letter-spacing:-.055em;color:var(--gold);margin:0 0 24px}.message p{font-size:clamp(1rem,2.6vw,1.2rem);line-height:1.65;color:#e8eefb;margin:auto;max-width:480px}.confetti{position:fixed;z-index:10;top:-18px;width:9px;height:14px;animation:fall 3.2s linear forwards}@keyframes fall{to{transform:translate(var(--x),110vh) rotate(720deg)}}@media(max-width:480px){.cake{transform:scale(.84);margin:-20px auto}.prompt{height:105px}.label{margin-bottom:0}}
</style></head><body><div class="sky"></div><main class="scene"><section class="stage" id="stage"><div class="label">For Shivansh</div><div class="cake" id="cake"><div class="plate"></div><div class="tier bottom"></div><div class="tier middle"></div><div class="tier top"></div><div class="candle c1"><i class="flame"></i></div><div class="candle c2"><i class="flame"></i></div><div class="candle c3"><i class="flame"></i></div><div class="candle c4"><i class="flame"></i></div><div class="candle c5"><i class="flame"></i></div><div class="candle c6"><i class="flame"></i></div></div><div class="prompt"><p class="instruction">Strike the match</p><div class="matchbox" id="box"><i class="strip"></i><i class="match" id="match"></i></div><div class="hint">Drag to the right</div><button class="blow" id="blow">Make a wish & blow out the candles</button></div></section><section class="message"><div><h1>Happy Birthday,<br>Shivansh!</h1><p>Hope you have a lovely day and a wonderful year ahead.<br><br>— Yasha</p></div></section></main><script>
const M=document.getElementById('match'),B=document.getElementById('box'),S=document.getElementById('stage'),C=document.getElementById('cake'),candles=[...document.querySelectorAll('.candle')];let drag=false,start=0,struck=false;
M.onpointerdown=e=>{if(struck)return;drag=true;start=e.clientX;M.setPointerCapture(e.pointerId)};M.onpointermove=e=>{if(!drag||struck)return;let max=B.clientWidth-M.offsetWidth-8,x=Math.max(12,Math.min(max,12+e.clientX-start));M.style.left=x+'px';if(x>max*.82)ignite()};M.onpointerup=()=>{drag=false;if(!struck)M.style.left='12px'};
async function ignite(){struck=true;drag=false;M.classList.add('burning');await wait(420);let r=M.getBoundingClientRect();M.style.position='fixed';M.style.left=r.left+'px';M.style.top=r.top+'px';M.style.width='130px';document.body.appendChild(M);for(const c of [...candles].reverse()){let q=c.getBoundingClientRect(),to={left:q.left-118+'px',top:q.top-8+'px',transform:'rotate(-10deg)'};await M.animate([{left:M.style.left,top:M.style.top,transform:'rotate(0)'},to],{duration:520,easing:'cubic-bezier(.4,0,.2,1)',fill:'forwards'}).finished;M.style.left=to.left;M.style.top=to.top;c.classList.add('on');await wait(170)}await M.animate([{opacity:1},{opacity:0}],{duration:400,fill:'forwards'}).finished;M.remove();S.classList.add('ready')}
document.getElementById('blow').onclick=()=>{C.classList.add('out');setTimeout(()=>{S.classList.add('finished');song();confetti()},500)};function wait(ms){return new Promise(r=>setTimeout(r,ms))}
function confetti(){let col=['#ffd46a','#cf7180','#8eb7ee','#fff'];for(let i=0;i<90;i++){let c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background=col[i%4];c.style.setProperty('--x',Math.random()*190-95+'px');c.style.animationDelay=Math.random()*.5+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),4000)}}
function song(){let X=new(window.AudioContext||window.webkitAudioContext)(),N={G:392,A:440,B:493.88,C:523.25,D:587.33,E:659.25,F:349.23},q=[['G',.22],['G',.22],['A',.44],['G',.44],['C',.44],['B',.8],['G',.22],['G',.22],['A',.44],['G',.44],['D',.44],['C',.8],['G',.22],['G',.22],['E',.44],['C',.44],['B',.44],['A',.8],['F',.22],['F',.22],['E',.44],['C',.44],['D',.44],['C',.8]],t=X.currentTime+.1;q.forEach(([n,d])=>{let o=X.createOscillator(),g=X.createGain();o.type='triangle';o.frequency.value=N[n];g.gain.setValueAtTime(.1,t);g.gain.exponentialRampToValueAtTime(.001,t+d*.9);o.connect(g).connect(X.destination);o.start(t);o.stop(t+d);t+=d})}
</script></body></html>
