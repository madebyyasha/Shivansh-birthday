<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Happy Birthday Shivansh</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:Georgia,serif;background:#07142d;color:#fff;touch-action:none}.sky{position:fixed;inset:0;background:radial-gradient(circle at 50% 115%,#2d4779,transparent 52%),linear-gradient(#061127,#102044)}.sky:after{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,#fff 0 1px,transparent 1.4px);background-size:47px 47px;opacity:.2}.scene{position:relative;z-index:2;height:100%;display:grid;place-items:center;text-align:center;padding:16px}.stage{width:min(620px,100%)}.tiny{font:700 .7rem Arial;letter-spacing:.22em;text-transform:uppercase;color:#a9bae0;margin-bottom:15px}
.cake{height:225px;position:relative;margin:0 auto 8px;width:280px}.plate{position:absolute;bottom:0;width:100%;height:12px;background:#c9d6ee;border-radius:50%}.tier{position:absolute;border-radius:13px 13px 6px 6px;background:linear-gradient(90deg,#e7c9a3,#fff1d5 48%,#dcb88d);box-shadow:inset 0 -10px #9a5b451f,0 5px #bd6d78}.t1{bottom:11px;left:20px;width:240px;height:64px}.t2{bottom:78px;left:48px;width:184px;height:58px}.t3{bottom:139px;left:77px;width:126px;height:51px}.candle{position:absolute;width:10px;height:42px;bottom:190px;border-radius:4px 4px 0 0;background:repeating-linear-gradient(145deg,#f7e6b6 0 6px,#bb4b48 7px 12px)}.c1{left:105px}.c2{left:135px}.c3{left:165px}.wick{position:absolute;width:2px;height:7px;background:#333;left:4px;top:-6px}.flame{position:absolute;width:18px;height:27px;left:-4px;top:-33px;border-radius:50%;background:radial-gradient(circle at 50% 68%,#fff 0 13%,#ffd95d 25%,#ff8b32 64%,transparent 68%);filter:drop-shadow(0 0 13px #ffca4f);opacity:0;transform:scale(.1);transition:.5s}.lit .flame{opacity:1;transform:scale(1);animation:flicker .45s infinite alternate}.out .flame{opacity:0!important;transform:translateX(15px) scale(.1)!important}@keyframes flicker{to{transform:scale(.88) rotate(3deg)}}
.instruction{font-size:clamp(1.15rem,4vw,1.6rem);margin:0 0 14px}.match-area{position:relative;width:min(390px,90vw);height:78px;margin:auto}.box{position:absolute;inset:14px 0 auto;height:50px;border-radius:7px;background:#e4c895}.strip{position:absolute;right:15px;top:9px;width:150px;height:32px;background:repeating-linear-gradient(45deg,#6b342d 0 2px,#8a4a3c 2px 4px)}.match{position:absolute;left:13px;top:26px;width:190px;height:12px;border-radius:99px;background:#e5c37d;z-index:3;filter:drop-shadow(0 3px 2px #0006)}.match:after{content:"";position:absolute;right:-7px;top:-5px;width:23px;height:23px;border-radius:50%;background:#a73530}.hint{font:600 .68rem Arial;letter-spacing:.12em;text-transform:uppercase;color:#9eadd0}.litstage .match-area,.litstage .instruction,.litstage .hint{display:none}
.blow{display:none;margin:12px auto;border:1px solid #ffffff88;background:#ffffff12;color:#fff;border-radius:99px;padding:14px 22px;font:700 .72rem Arial;letter-spacing:.12em;text-transform:uppercase}.litstage .blow{display:block}.done .blow{display:none}.message{opacity:0;transform:translateY(15px);transition:1s .25s;pointer-events:none}.done .message{opacity:1;transform:none}.message h1{font-size:clamp(2.6rem,9vw,5.5rem);line-height:.92;color:#f4c85b;margin:8px 0 18px}.message p{font-size:clamp(1rem,2.5vw,1.15rem);line-height:1.6;color:#e7edfa;margin:auto}.spark,.confetti{position:fixed;pointer-events:none}.spark{width:5px;height:5px;border-radius:50%;background:#ffd35d;box-shadow:0 0 8px #ffb42e;animation:spark .8s forwards}@keyframes spark{to{opacity:0;transform:translate(var(--x),var(--y)) scale(0)}}.confetti{top:-20px;width:9px;height:14px;animation:fall 3s linear forwards}@keyframes fall{to{transform:translate(var(--x),110vh) rotate(700deg)}}@media(max-width:500px){.cake{transform:scale(.78);margin:-25px auto -17px}.match{width:155px}.strip{width:130px}.tiny{margin-bottom:4px}}
</style></head><body><div class="sky"></div><main class="scene"><section class="stage" id="stage"><div class="tiny">For Shivansh</div><div class="cake" id="cake"><div class="plate"></div><div class="tier t1"></div><div class="tier t2"></div><div class="tier t3"></div><div class="candle c1"><i class="wick"></i><i class="flame"></i></div><div class="candle c2"><i class="wick"></i><i class="flame"></i></div><div class="candle c3"><i class="wick"></i><i class="flame"></i></div></div><p class="instruction">Strike the match to light the candles</p><div class="match-area" id="area"><div class="box"><i class="strip"></i></div><div class="match" id="match"></div></div><div class="hint">Drag the match to the right</div><button class="blow" id="blow">Blow out the candles</button><div class="message"><h1>Happy Birthday,<br>Shivansh!</h1><p>Hope you have a lovely day and a wonderful year ahead.<br><br>— Yasha</p></div></section></main><script>
const M=document.getElementById('match'),A=document.getElementById('area'),S=document.getElementById('stage'),C=document.getElementById('cake');let down=false,start=0,done=false;M.onpointerdown=e=>{if(done)return;down=true;start=e.clientX;M.setPointerCapture(e.pointerId)};M.onpointermove=e=>{if(!down||done)return;let max=A.clientWidth-M.offsetWidth-8,x=Math.max(13,Math.min(max,13+e.clientX-start));M.style.left=x+'px';if(x>max*.78)light(e.clientX,e.clientY)};M.onpointerup=()=>{down=false;if(!done)M.style.left='13px'};
function light(x,y){done=true;C.classList.add('lit');S.classList.add('litstage');for(let i=0;i<24;i++){let s=document.createElement('i');s.className='spark';s.style.left=x+'px';s.style.top=y+'px';s.style.setProperty('--x',Math.random()*120-60+'px');s.style.setProperty('--y',Math.random()*100-70+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),900)}}
document.getElementById('blow').onclick=()=>{C.classList.add('out');S.classList.add('done');song();let col=['#f4c85b','#d96b73','#82aee7','#fff'];for(let i=0;i<80;i++){let c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background=col[i%4];c.style.setProperty('--x',Math.random()*180-90+'px');c.style.animationDelay=Math.random()*.5+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),3700)}};
function song(){let X=new(window.AudioContext||window.webkitAudioContext)(),N={G:392,A:440,B:493.88,C:523.25,D:587.33,E:659.25,F:349.23},q=[['G',.22],['G',.22],['A',.44],['G',.44],['C',.44],['B',.8],['G',.22],['G',.22],['A',.44],['G',.44],['D',.44],['C',.8],['G',.22],['G',.22],['E',.44],['C',.44],['B',.44],['A',.8],['F',.22],['F',.22],['E',.44],['C',.44],['D',.44],['C',.8]],t=X.currentTime+.1;q.forEach(([n,d])=>{let o=X.createOscillator(),g=X.createGain();o.type='sine';o.frequency.value=N[n];g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d*.9);o.connect(g).connect(X.destination);o.start(t);o.stop(t+d);t+=d})}
</script></body></html>
