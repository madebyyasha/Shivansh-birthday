<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Happy Birthday Shivansh</title>
  <style>
    :root{--ink:#354263;--pink:#e97991;--blue:#85bae5;--gold:#e7aa2d;--cream:#fff8e9}
    *{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}
    body{font-family:Georgia,serif;color:var(--ink);background:var(--cream)}
    button{font:inherit}
    .back{position:fixed;inset:0;background:radial-gradient(circle at 8% 14%,#f7b1c0 0 7%,transparent 7.3%),radial-gradient(circle at 92% 22%,#a8d3f1 0 9%,transparent 9.3%),radial-gradient(circle at 76% 92%,#f6d57d 0 11%,transparent 11.3%),linear-gradient(145deg,#fffaf0,#fae9ee 58%,#e8f4fc)}
    .doodle{position:absolute;color:#d86f87;font-size:1.4rem;animation:float 2s ease-in-out infinite alternate}.d1{left:10%;top:12%}.d2{right:13%;top:12%;animation-delay:.5s}.d3{left:14%;bottom:18%;animation-delay:1s}.d4{right:10%;bottom:24%;animation-delay:1.4s}
    @keyframes float{to{transform:translateY(-9px) rotate(12deg)}}
    .scene{position:relative;z-index:2;height:100svh;display:grid;place-items:center;text-align:center;padding:14px}.stage{width:min(570px,100%)}.intro{font-size:clamp(1.1rem,3.5vw,1.4rem);font-style:italic;margin:0 0 18px}
    .gift{position:relative;width:270px;height:210px;margin:auto;cursor:pointer;transition:transform .2s}.gift:hover{transform:translateY(-3px)}.gift:focus-visible{outline:3px solid var(--pink);outline-offset:8px;border-radius:12px}
    .box{position:absolute;left:20px;bottom:12px;width:230px;height:132px;border-radius:8px;background:linear-gradient(90deg,#8abde7,#b9daf4 48%,#75abd9);box-shadow:0 12px 25px #5261843b}.box:after{content:"";position:absolute;inset:0;background:radial-gradient(circle,#fff 0 3px,transparent 3.5px);background-size:34px 34px;opacity:.5}
    .lid{position:absolute;z-index:3;left:8px;bottom:137px;width:254px;height:35px;border-radius:8px;background:#73a9d7;box-shadow:0 5px 10px #52618435;transform-origin:left bottom}.ribbon-v{position:absolute;z-index:4;left:119px;bottom:12px;width:32px;height:160px;background:#e97991}
    .bow{position:absolute;z-index:6;left:91px;bottom:160px;width:88px;height:48px}.bow:before,.bow:after{content:"";position:absolute;top:7px;width:54px;height:35px;background:linear-gradient(135deg,#f39aae,#d95e79);box-shadow:inset 0 4px 7px #ffffff55,0 4px 8px #7d3d4b28}.bow:before{left:0;border-radius:65% 35% 55% 45%;transform:rotate(14deg)}.bow:after{right:0;border-radius:35% 65% 45% 55%;transform:rotate(-14deg)}
    .knot{position:absolute;z-index:7;left:119px;bottom:170px;width:32px;height:28px;border-radius:50%;background:linear-gradient(135deg,#f8a7b8,#d85f79);box-shadow:inset 0 4px 6px #ffffff55,0 3px 6px #7d3d4b33}.knot:before,.knot:after{content:"";position:absolute;z-index:-1;top:18px;width:18px;height:53px;background:linear-gradient(#e97991,#d85f79);border-radius:3px 3px 14px 3px}.knot:before{left:1px;transform:rotate(16deg)}.knot:after{right:1px;transform:rotate(-16deg);border-radius:3px 3px 3px 14px}
    .gift-bow{position:absolute;z-index:7;left:50%;bottom:150px;transform:translateX(-50%);font-size:68px;line-height:1;filter:drop-shadow(0 5px 5px #7d3d4b33);animation:bowBounce 1.35s ease-in-out infinite alternate} bowBounce{to{transform:translateX(-50%) translateY(-5px) rotate(3deg)}}.hint{font:700 .68rem Arial;letter-spacing:.15em;text-transform:uppercase;color:#6f7899;margin-top:5px}
    .opening .gift-bow{animation:untie .48s forwards}.opening .lid{animation:lid .78s .25s cubic-bezier(.2,.8,.3,1.2) forwards}.opening .box,.opening .ribbon-v{animation:boxAway .5s .95s forwards}.opening .intro,.opening .hint{opacity:0;transition:.3s}
    @keyframes untie{to{transform:translateX(-50%) translateY(-35px) scale(.55) rotate(16deg);opacity:0}}@keyframes lid{to{transform:translate(-35px,-100px) rotate(-22deg);opacity:0}}@keyframes boxAway{to{opacity:0;transform:translateY(45px)}}
    .cake-wrap{height:0;opacity:0;pointer-events:none;position:relative}.revealed .gift{display:none}.revealed .cake-wrap{height:390px;opacity:1;pointer-events:auto}.cake{position:relative;width:310px;height:275px;margin:auto;animation:cakeUp .82s cubic-bezier(.2,.85,.3,1.25) both}
    @keyframes cakeUp{from{opacity:0;transform:translateY(130px) scale(.7)}70%{transform:translateY(-7px) scale(1.03)}to{opacity:1;transform:none}}
    .plate{position:absolute;left:5px;bottom:8px;width:300px;height:13px;border-radius:50%;background:#c8d8ed;box-shadow:0 7px 18px #52618455}.tier{position:absolute;left:50%;transform:translateX(-50%);border-radius:15px 15px 7px 7px;background:linear-gradient(90deg,#e5bc8e,#fff0ce 46%,#dbae7d);border-bottom:6px solid #d5657c;box-shadow:0 7px 13px #52618428}.tier:after{content:"";position:absolute;inset:-1px 0 auto;height:17px;background:radial-gradient(circle at 12px 0,#fff9eb 0 12px,transparent 12.5px);background-size:24px 18px}.tier:before{content:"✦  ·  ✧  ·  ✦";position:absolute;left:0;right:0;bottom:9px;color:#d5657c;font:700 13px Arial;letter-spacing:8px;white-space:nowrap;overflow:hidden}.t1{bottom:20px;width:265px;height:70px}.t2{bottom:95px;width:201px;height:63px}.t3{bottom:163px;width:137px;height:57px}
    .candle{position:absolute;width:9px;height:33px;border-radius:5px 5px 1px 1px;background:repeating-linear-gradient(140deg,#fff1b9 0 6px,#df6b7e 7px 12px);z-index:3}.candle:before{content:"";position:absolute;left:4px;top:-6px;width:2px;height:7px;background:#333}.flame{position:absolute;left:-4px;top:-30px;width:17px;height:25px;border-radius:50%;background:radial-gradient(circle at 50% 68%,#fff 0 12%,#ffe676 24%,#ff8b39 62%,transparent 65%);filter:drop-shadow(0 0 10px #ffcb52);opacity:0;transform:scale(.1);transition:.3s}.on{animation:boing .35s}.on .flame{opacity:1;transform:scale(1);animation:flicker .4s infinite alternate}.out .flame{opacity:0!important;transform:translate(12px,-9px) scale(.1)!important}.c1{left:48px;bottom:90px}.c2{left:150px;bottom:90px}.c3{left:252px;bottom:90px}.c4{left:104px;bottom:158px}.c5{left:197px;bottom:158px}.c6{left:150px;bottom:220px}
    @keyframes boing{50%{transform:translateY(-8px)}}@keyframes flicker{to{transform:scale(.86) rotate(4deg)}}
    .blow{opacity:0;pointer-events:none;max-width:340px;border:1px solid #52618766;background:#fff;color:#354263;border-radius:99px;padding:14px 22px;font:700 .72rem/1.35 Arial;letter-spacing:.09em;text-transform:uppercase;box-shadow:0 7px 20px #52618422;transition:opacity .5s,transform .2s}.ready .blow{opacity:1;pointer-events:auto}.blow:hover{transform:translateY(-2px)}.blow:active{transform:scale(.97)}
    .message{position:fixed;z-index:8;inset:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle,#fff8e9,#f7dce5 68%);opacity:0;pointer-events:none;transition:.8s}.stage.finished + .message{opacity:1}.message h1{font-size:clamp(3rem,11vw,6.3rem);line-height:.88;letter-spacing:-.06em;color:#d86880;margin:0 0 22px;text-shadow:0 5px 0 #f6c7d1}.stage.finished + .message h1{animation:pop .8s .25s cubic-bezier(.2,.85,.3,1.3) both}.message p{font-size:clamp(1rem,2.7vw,1.22rem);line-height:1.65;color:#475370;margin:auto;max-width:500px}
    @keyframes pop{from{opacity:0;transform:scale(.5) rotate(-5deg)}}.spark,.smoke,.confetti{position:fixed;z-index:10;pointer-events:none}.spark{width:6px;height:6px;border-radius:50%;background:#e7aa2d;box-shadow:0 0 8px #e7aa2d;animation:burst .7s forwards}.smoke{color:#94a0b7;font:700 24px Georgia;animation:smoke 1.1s ease-out forwards}.confetti{top:-20px;width:10px;height:15px;animation:fall 3.2s linear forwards}
    @keyframes burst{to{opacity:0;transform:translate(var(--x),var(--y)) scale(0)}}@keyframes smoke{to{opacity:0;transform:translate(13px,-48px) scale(1.5)}}@keyframes fall{to{transform:translate(var(--x),110vh) rotate(760deg)}}
    @media(max-width:480px){.intro{margin-bottom:8px}.gift{transform:scale(.86);margin:-15px auto}.gift:hover{transform:scale(.86)}.revealed .cake-wrap{height:350px}.cake{width:300px}.blow{max-width:290px;padding:13px 18px}.message{padding:22px}}
    @media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div class="back"><i class="doodle d1">✦</i><i class="doodle d2">〰</i><i class="doodle d3">✧</i><i class="doodle d4">⌁</i></div>
  <main class="scene">
    <section class="stage" id="stage">
      <p class="intro">A birthday obviously requires cake.</p>
      <div class="gift" id="gift" role="button" tabindex="0" aria-label="Open the birthday gift">
        <div class="box"></div><i class="ribbon-v"></i><i class="lid"></i><span class="gift-bow" aria-hidden="true">🎀</span>
      </div>
      <div class="hint">Tap the gift to open</div>
      <div class="cake-wrap">
        <div class="cake" id="cake">
          <i class="plate"></i><i class="tier t1"></i><i class="tier t2"></i><i class="tier t3"></i>
          <i class="candle c1"><b class="flame"></b></i><i class="candle c2"><b class="flame"></b></i><i class="candle c3"><b class="flame"></b></i>
          <i class="candle c4"><b class="flame"></b></i><i class="candle c5"><b class="flame"></b></i><i class="candle c6"><b class="flame"></b></i>
        </div>
        <button class="blow" id="blow">Make a wish, then tap to blow out the candles ✦</button>
      </div>
    </section>
    <section class="message"><div><h1>Happy Birthday,<br>Shivansh!!!</h1><p>I hope you have the loveliest birthday and that the year ahead is very good to you.</p></div></section>
  </main>
  <script>
    const S=document.getElementById('stage'),G=document.getElementById('gift'),C=document.getElementById('cake'),K=[...document.querySelectorAll('.candle')];
    let opened=false,finished=false;
    G.addEventListener('click',openGift);
    G.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openGift()}});
    async function openGift(){
      if(opened)return;opened=true;softTone(523,.12);S.classList.add('opening');
      await wait(1400);S.classList.add('revealed');await wait(650);
      for(const c of K){c.classList.add('on');spark(c);softTone(660,.045);await wait(160)}
      await wait(180);S.classList.add('ready');
    }
    document.getElementById('blow').addEventListener('click',()=>{
      if(finished)return;finished=true;K.forEach(smoke);C.classList.add('out');
      setTimeout(()=>{S.classList.add('finished');music();party()},650);
    });
    function wait(ms){return new Promise(r=>setTimeout(r,ms))}
    function spark(c){const r=c.getBoundingClientRect();for(let i=0;i<8;i++){const s=document.createElement('i');s.className='spark';s.style.left=r.left+4+'px';s.style.top=r.top-10+'px';s.style.setProperty('--x',Math.random()*74-37+'px');s.style.setProperty('--y',Math.random()*66-52+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),750)}}
    function smoke(c){const r=c.getBoundingClientRect(),s=document.createElement('i');s.className='smoke';s.textContent='~';s.style.left=r.left+'px';s.style.top=r.top-30+'px';document.body.appendChild(s);setTimeout(()=>s.remove(),1200)}
    function party(){const col=['#e7aa2d','#e97991','#85bae5','#fff'];for(let i=0;i<110;i++){const c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background=col[i%4];c.style.borderRadius=i%3?'2px':'50%';c.style.setProperty('--x',Math.random()*220-110+'px');c.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),4100)}}
    function softTone(freq,vol){const X=new(window.AudioContext||window.webkitAudioContext)(),o=X.createOscillator(),g=X.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(vol,X.currentTime);g.gain.exponentialRampToValueAtTime(.001,X.currentTime+.22);o.connect(g).connect(X.destination);o.start();o.stop(X.currentTime+.23)}
    function music(){const X=new(window.AudioContext||window.webkitAudioContext)(),N={G:392,A:440,B:493.88,C:523.25,D:587.33,E:659.25,F:349.23},q=[['G',.2],['G',.2],['A',.4],['G',.4],['C',.4],['B',.75],['G',.2],['G',.2],['A',.4],['G',.4],['D',.4],['C',.75],['G',.2],['G',.2],['E',.4],['C',.4],['B',.4],['A',.75],['F',.2],['F',.2],['E',.4],['C',.4],['D',.4],['C',.8]];let t=X.currentTime+.1;q.forEach(([n,d])=>{const o=X.createOscillator(),g=X.createGain();o.type='triangle';o.frequency.value=N[n];g.gain.setValueAtTime(.1,t);g.gain.exponentialRampToValueAtTime(.001,t+d*.9);o.connect(g).connect(X.destination);o.start(t);o.stop(t+d);t+=d})}
  </script>
</body></html>
